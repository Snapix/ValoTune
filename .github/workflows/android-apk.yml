name: Build ValoTune Android Debug APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_API_BASE_URL: https://valotune.vercel.app

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate ValoTune Android launcher assets
        run: |
          mkdir -p assets
          npm install --no-save sharp @capacitor/assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { readFile } from 'node:fs/promises';
          const svg = await readFile('public/valotune-icon.svg');
          await sharp(svg).resize(1024, 1024, { fit: 'contain' }).png().toFile('assets/icon.png');
          await sharp(svg).resize(1024, 1024, { fit: 'contain' }).png().toFile('assets/splash.png');
          NODE
          npx capacitor-assets generate --android --iconBackgroundColor '#0a0a0c' --splashBackgroundColor '#0a0a0c'

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify debug APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "Debug APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: valotune-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
